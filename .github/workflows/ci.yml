name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Devos.BrowserRuntime.slnx

      - name: Build
        run: dotnet build Devos.BrowserRuntime.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Devos.BrowserRuntime.slnx --configuration Release --no-build --verbosity normal
